services:
  db:
    image: postgres:16
    container_name: traffic-signal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deval
      POSTGRES_PASSWORD: deval_traffic_2026
      POSTGRES_DB: traffic_signal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: